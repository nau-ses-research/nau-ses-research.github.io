<!-- SEO and Structured Data -->
<meta name="description" content="{{ with .Summary }}{{ . }}{{ else }}{{ with .Site.Params.marketing.seo.description }}{{ . }}{{ end }}{{ end }}">
<meta name="keywords" content="earth sciences, environmental sustainability, geology, climate science, NAU, Northern Arizona University, graduate programs, undergraduate degrees, research, faculty, paleoclimatology, tectonics, environmental policy">

<!-- Open Graph / Facebook -->
<meta property="og:type" content="website">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:title" content="{{ .Title }}">
<meta property="og:description" content="{{ with .Summary }}{{ . }}{{ else }}{{ with .Site.Params.marketing.seo.description }}{{ . }}{{ end }}{{ end }}">
<meta property="og:site_name" content="{{ .Site.Title }}">

<!-- Twitter -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="@{{ .Site.Params.marketing.seo.twitter }}">
<meta name="twitter:title" content="{{ .Title }}">
<meta name="twitter:description" content="{{ with .Summary }}{{ . }}{{ else }}{{ with .Site.Params.marketing.seo.description }}{{ . }}{{ end }}{{ end }}">

<!-- Canonical URL -->
<link rel="canonical" href="{{ .Permalink }}">

<!-- Additional Domain References -->
<link rel="alternate" href="{{ replace .Permalink "ses-nau.org" "ses-nau.com" }}">

<!-- Structured Data for Educational Organization -->
{{ if .IsHome }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "EducationalOrganization",
  "name": "{{ .Site.Params.marketing.seo.org_name }}",
  "url": "{{ .Site.BaseURL }}",
  "logo": "{{ .Site.BaseURL }}media/icon_hua2ec155b4296a9c9791d015323e16eb5_11927_192x192_fill_lanczos_center_3.png",
  "description": "{{ .Site.Params.marketing.seo.description }}",
  "address": {
    "@type": "PostalAddress",
    "streetAddress": "Building 11, Ashurst Hall",
    "addressLocality": "Flagstaff",
    "addressRegion": "AZ",
    "postalCode": "86011",
    "addressCountry": "US"
  },
  "contactPoint": {
    "@type": "ContactPoint",
    "telephone": "928-523-9333",
    "contactType": "customer service",
    "email": "SES.Admin@nau.edu"
  },
  "sameAs": [
    "https://nau.edu/cefns/ses/",
    "https://twitter.com/nau_ses",
    "https://www.facebook.com/NAUSESAZ/",
    "https://www.instagram.com/nau_ses/",
    "https://nau-ses.bsky.social/",
    "https://ses-nau.com/"
  ],
  "parentOrganization": {
    "@type": "EducationalOrganization",
    "name": "Northern Arizona University",
    "url": "https://nau.edu"
  }
}
</script>
{{ end }}
